services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tama_hidrovias
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d tama_hidrovias"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tama-network

  pgadmin:
    image: dpage/pgadmin4:9.14
    restart: unless-stopped
    ports:
      # Overridable in case host port 5050 is already taken by something
      # else on the host -- same reasoning as STRAPI_HOST_PORT/NGINX_HOST_PORT.
      - "${PGADMIN_HOST_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@tama-hidrovias.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_this_pgadmin_password}
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - tama-network

  strapi:
    build: ./cms
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      # Overridable in case host port 1337 is already taken by something
      # else on the host (e.g. an unrelated local service/tool) -- same
      # reasoning as NGINX_HOST_PORT below.
      - "${STRAPI_HOST_PORT:-1337}:1337"
    env_file:
      - .env
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: tama_hidrovias
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi_password
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Only the uploads directory persists on the host -- NOT the whole
      # ./cms tree. Bind-mounting the full source over /srv/app would shadow
      # the image's own compiled admin panel (Dockerfile's `RUN npm run
      # build`, which writes to /srv/app/build) with whatever's on the host,
      # which is empty on a fresh checkout since `cms/build/` is gitignored
      # -- breaking the admin panel with an ENOENT on a clean deploy. Local
      # hot-reload dev still gets the full bind mount, added back in
      # docker-compose.dev.yml only.
      - ./cms/public/uploads:/srv/app/public/uploads
    networks:
      - tama-network

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-}
        NEXT_PUBLIC_TILESERVER_URL: ${NEXT_PUBLIC_TILESERVER_URL:-}
        NEXT_PUBLIC_FORECAST_COLORMAP: ${NEXT_PUBLIC_FORECAST_COLORMAP:-}
        NEXT_PUBLIC_FORECAST_OPACITY: ${NEXT_PUBLIC_FORECAST_OPACITY:-}
        NEXT_PUBLIC_FORECAST_MIN: ${NEXT_PUBLIC_FORECAST_MIN:-}
        NEXT_PUBLIC_FORECAST_MAX: ${NEXT_PUBLIC_FORECAST_MAX:-}
        NEXT_PUBLIC_STATION_CLUSTER_RADIUS: ${NEXT_PUBLIC_STATION_CLUSTER_RADIUS:-65}
        NEXT_PUBLIC_SWOT_CLUSTER_RADIUS: ${NEXT_PUBLIC_SWOT_CLUSTER_RADIUS:-65}
        NEXT_PUBLIC_SHOW_STATION_MARKERS: ${NEXT_PUBLIC_SHOW_STATION_MARKERS:-false}
        NEXT_PUBLIC_SWOT_METRIC_SELECTOR_ENABLED: ${NEXT_PUBLIC_SWOT_METRIC_SELECTOR_ENABLED:-false}
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Internal-only Strapi URL used by server-side helpers
      STRAPI_INTERNAL_URL: http://strapi:1337
    depends_on:
      - strapi
    networks:
      - tama-network
    volumes:
      - ./assets/tiff:/forecast-tiles

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    restart: unless-stopped
    command: uvicorn titiler.application.main:app --host 0.0.0.0 --port 8080 --workers 1
    ports:
      # Overridable, same reasoning as STRAPI_HOST_PORT/NGINX_HOST_PORT.
      # Published directly (not only reachable via nginx) so a Cloudflare
      # Tunnel or another reverse proxy can target this container's own
      # port as an origin service, e.g. for a secondary/backup titiler
      # instance.
      - "${TITILER_HOST_PORT:-8002}:8080"
    volumes:
      - ./assets/tiff:/data/geotiffs
    networks:
      - tama-network


  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - strapi
      - titiler
    ports:
      # Overridable because Compose *merges* (concatenates) `ports:` lists
      # across -f files rather than replacing them -- a literal port here
      # can't be removed or swapped by an override file, only changed via
      # this variable (e.g. NGINX_HOST_PORT=8088 docker compose ... up),
      # which is what the netuno prod deployment does to avoid clashing
      # with other containers already using host port 8000 there.
      - "${NGINX_HOST_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Shared static assets
      - ./assets:/srv/assets:ro
      # Strapi uploads directory (served at `/uploads/` by Nginx)
      - ./cms/public/uploads:/srv/strapi-uploads:ro
    networks:
      - tama-network

  python-worker:
    build: ./pipeline
    restart: always
    command: python -m tama_hidrovias.automation.run_scheduler
    env_file:
      - .env
    volumes:
      - ./data:/data
    depends_on:
      - strapi
    networks:
      - tama-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  tama-network:
    driver: bridge
