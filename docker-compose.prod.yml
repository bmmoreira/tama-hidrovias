version: "3.9"

# Production-oriented override file, currently tuned for the netuno test
# deployment (base domain brunomoreira.dev). Usage:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# TLS is terminated by the host's existing Nginx Proxy Manager (NPM), not by
# this stack's own `nginx` service. NPM reaches this project's `nginx`
# container directly over the external `frontend` Docker network (the same
# network NPM's own container is attached to) and forwards plain HTTP to it,
# so `nginx/nginx.conf` itself needs no SSL configuration. The host port this
# stack's nginx publishes (NGINX_HOST_PORT, see docker-compose.yml) is only
# used for direct debugging -- NPM never goes through it.
#
# One-time setup required in the NPM admin UI (not managed by this file):
# create a Proxy Host for each of the four hostnames below, forwarding to
# "tama-nginx" port 80 over the `frontend` network.

services:
  strapi:
    environment:
      NODE_ENV: production

  titiler:
    # Published directly (bypassing tama-nginx) so the Cloudflare Tunnel's
    # "tiles.brunomoreira.dev" public hostname can point straight at this
    # container as its origin service (http://localhost:8002), instead of
    # going through tama-nginx's own published port.
    ports:
      - "8002:8080"

  web:
    build:
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time,
      # so the production hostnames must be passed here too, not just via
      # `environment:` below (which only affects the already-built runtime).
      args:
        NEXT_PUBLIC_STRAPI_URL: https://db.brunomoreira.dev
        NEXT_PUBLIC_TILESERVER_URL: https://tiles.brunomoreira.dev
    environment:
      NODE_ENV: production
      # Public URL of the app in production (used by NextAuth, links, etc.)
      NEXTAUTH_URL: https://tama-hidrovias.brunomoreira.dev
      # Browser-facing URL for Strapi, matching the gateway hostname.
      NEXT_PUBLIC_STRAPI_URL: https://db.brunomoreira.dev

  nginx:
    # Fixed name so it's easy to reference as the "Forward Hostname" when
    # configuring Proxy Hosts in Nginx Proxy Manager.
    container_name: tama-nginx
    networks:
      - tama-network
      - frontend
    environment:
      # Not read by nginx.conf directly (no envsubst templating is used) --
      # kept here for operator reference / monitoring only.
      APP_PUBLIC_URL: https://tama-hidrovias.brunomoreira.dev
      STRAPI_PUBLIC_URL: https://db.brunomoreira.dev
      ASSETS_PUBLIC_URL: https://assets.brunomoreira.dev
      TITILER_PUBLIC_URL: https://tiles.brunomoreira.dev

networks:
  # Pre-existing network created by/for the host's Nginx Proxy Manager
  # install; must already exist on the host (docker network ls).
  frontend:
    external: true
